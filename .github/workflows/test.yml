name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Unit, fuzz, invariant and fork tests
        env:
          BASE_RPC_URL: https://mainnet.base.org
        run: forge test -vv

      - name: Mutants
        run: python3 scripts/mutants.py
