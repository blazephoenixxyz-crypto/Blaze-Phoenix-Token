name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix deploy

      - name: Foundry tests (no fork)
        run: forge test --no-match-contract Fork

      - name: Deploy script tests
        run: node --test deploy/test/*.test.mjs
