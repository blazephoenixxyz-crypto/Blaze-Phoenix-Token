[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
# Same settings as the deployed bytecode and its Basescan verification.
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 5000
seed = "0xb2b2"

[invariant]
runs = 256
depth = 64
fail_on_revert = true

[rpc_endpoints]
base = "${BASE_RPC_URL}"
